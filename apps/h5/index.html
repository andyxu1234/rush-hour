<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F4F6F8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>汽车华容道</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4f6f8;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* 首屏加载指示：脚本就绪后由 main.ts 移除 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #868e96;
        font-size: 14px;
        letter-spacing: 0.08em;
        background: #f4f6f8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">正在准备棋盘…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
